version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailiq_db
      POSTGRES_USER: mailiq_user
      POSTGRES_PASSWORD: mailiq_pass
    ports:
      - '5432:5432'
    volumes:
      - mailiq_pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mailiq_user -d mailiq_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mailiq_pgdata:
    driver: local
